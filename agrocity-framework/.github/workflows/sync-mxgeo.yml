name: Sync mxGeoJSON

on:
  schedule:
    - cron: '0 6 1 * *'  # 1er día de cada mes a las 6am UTC
  workflow_dispatch:
    inputs:
      skip_colonias:
        description: 'Saltar colonias (solo actualizar municipios)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Forzar re-fetch de colonias aunque ya existan'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_colonias }}" = "true" ]; then
            ARGS="$ARGS --skip-colonias"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/sync-mxgeo.js $ARGS

      - name: Check for changes
        id: git-check
        run: |
          git add -N dist/mxGeoJSON/
          if git diff --name-only --exit-code dist/mxGeoJSON/; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'sync(mxgeo): actualización mensual del catálogo geoestadístico'
          title: 'sync(mxgeo): actualización mensual del catálogo'
          body: |
            Actualización automática del catálogo mxGeoJSON.

            ## Cambios realizados
            - Sincronización de municipios contra SEPOMEX vía cp.terio.dev
            - Actualización de colonias por código postal
            - Corrección de nombres y códigos INEGI

            ## Reporte
            Ver `scripts/.sync-report.json` para detalle de cambios.

            > Generado por workflow `sync-mxgeo.yml`
          branch: sync/mxgeo-monthly
          base: main
          labels: automation, mxgeo
